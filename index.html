<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Confidence Check-In</title>
<!-- Lets students add this to the iPad Home Screen and open it full-screen, no browser bar -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #2b3d36; }
  :root {
    --board: #2b3d36;
    --board-dark: #223129;
    --chalk: #f2ede1;
    --chalk-dim: #c9c2b2;
    --yellow: #e8b94a;
    --line: rgba(242,237,225,0.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  #app-root {
    font-family: 'Nunito', sans-serif;
    background: var(--board);
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(ellipse at 80% 90%, rgba(255,255,255,0.02), transparent 40%);
    color: var(--chalk);
    height: 100%;
    width: 100%;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .chalk-title { font-family: 'Kalam', cursive; font-weight: 700; filter: url(#chalkTexture); }

  .eyebrow {
    font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 800;
    letter-spacing: 2.5px; text-transform: uppercase; color: var(--yellow);
    opacity: 0.85; margin-bottom: 6px;
  }

  /* ---- setup screen ---- */
  .setup-wrap { width: 100%; max-width: 480px; margin-top: 60px; }
  .card {
    background: var(--board-dark); border: 1px solid var(--line);
    border-radius: 16px; padding: 28px;
  }
  input[type="text"] {
    width: 100%; background: rgba(242,237,225,0.06); border: 1.5px solid var(--line);
    border-radius: 10px; padding: 14px 16px; font-family: 'Nunito', sans-serif;
    font-size: 16px; color: var(--chalk); outline: none;
  }
  input[type="text"]:focus { border-color: var(--yellow); }
  input[type="text"]::placeholder { color: var(--chalk-dim); }
  button { font-family: 'Nunito', sans-serif; cursor: pointer; border: none; }
  .btn-primary {
    background: var(--yellow); color: var(--board-dark); font-weight: 800; font-size: 15px;
    padding: 13px 22px; border-radius: 10px; margin-top: 16px; width: 100%;
  }
  .btn-primary:disabled { opacity: 0.45; }
  .btn-ghost {
    background: transparent; color: var(--chalk-dim); border: 1.5px solid var(--line);
    font-weight: 700; font-size: 13px; padding: 10px 18px; border-radius: 10px; margin-top: 10px; width: 100%;
  }
  .error-msg { color: #e0745c; font-size: 13px; margin-top: 8px; }

  /* ---- mode toggle + custom answer builder ---- */
  .mode-toggle { display: flex; gap: 10px; margin-top: 18px; }
  .mode-btn {
    flex: 1; background: rgba(242,237,225,0.04); border: 1.5px solid var(--line);
    color: var(--chalk-dim); font-weight: 700; font-size: 13px; padding: 12px 8px;
    border-radius: 10px; text-align: center; line-height: 1.3;
  }
  .mode-btn.selected { border-color: var(--yellow); color: var(--chalk); background: rgba(232,185,74,0.1); }

  .custom-builder { margin-top: 18px; }
  .custom-builder .eyebrow { margin-top: 0; }
  .custom-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .custom-row input[type="text"] { flex: 1; }
  .remove-answer-btn {
    background: transparent; border: 1.5px solid var(--line); color: var(--chalk-dim);
    width: 40px; height: 44px; border-radius: 10px; font-size: 16px; font-weight: 700; flex-shrink: 0;
  }
  .remove-answer-btn:disabled { opacity: 0.25; }
  .remove-answer-btn:not(:disabled):hover { border-color: #e0745c; color: #e0745c; }

  /* ---- kiosk screen ---- */
  .kiosk-wrap {
    width: 100%; height: 100%; min-height: 78vh;
    display: flex; flex-direction: column; align-items: center;
  }
  .kiosk-question {
    font-family: 'Kalam', cursive; font-size: clamp(22px, 4vw, 36px);
    text-align: center; line-height: 1.3; filter: url(#chalkTexture);
    max-width: 780px; margin-top: 8px;
  }
  .kiosk-sub { font-size: 13px; color: var(--chalk-dim); margin-top: 8px; letter-spacing: 0.3px; }

  .answer-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;
    width: 100%; max-width: 900px; flex: 1; margin-top: 34px; align-items: stretch;
  }
  .answer-grid.count-2 { grid-template-columns: repeat(2, 1fr); max-width: 640px; }
  .answer-grid.count-3 { grid-template-columns: repeat(3, 1fr); max-width: 760px; }
  .answer-grid.count-5, .answer-grid.count-6 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 700px) {
    .answer-grid, .answer-grid.count-3, .answer-grid.count-5, .answer-grid.count-6 { grid-template-columns: repeat(2, 1fr); }
  }

  .smiley-btn {
    background: rgba(242,237,225,0.04); border: 1.5px solid var(--line); border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 24px 10px; min-height: 190px;
    transition: transform 0.1s ease, border-color 0.1s ease, background 0.1s ease;
  }
  .smiley-btn:active { transform: scale(0.95); border-color: var(--yellow); background: rgba(242,237,225,0.1); }
  .smiley-btn svg { width: 30%; max-width: 84px; filter: url(#chalkTexture); }
  .smiley-btn .cap { font-size: clamp(12px, 1.6vw, 15px); font-weight: 700; color: var(--chalk-dim); text-align: center; line-height: 1.3; }
  .smiley-btn:disabled { opacity: 0.4; }

  .custom-btn {
    background: rgba(242,237,225,0.04); border: 1.5px solid var(--line); border-radius: 20px;
    border-top: 5px solid var(--opt-color, var(--yellow));
    display: flex; align-items: center; justify-content: center;
    padding: 22px 16px; min-height: 140px;
    transition: transform 0.1s ease, border-color 0.1s ease, background 0.1s ease;
  }
  .custom-btn:active { transform: scale(0.96); background: rgba(242,237,225,0.1); }
  .custom-btn .cap {
    font-family: 'Nunito', sans-serif; font-weight: 700;
    font-size: clamp(15px, 2vw, 19px); color: var(--chalk); text-align: center; line-height: 1.35;
  }
  .custom-btn:disabled { opacity: 0.4; }

  /* thank-you overlay */
  .thanks-overlay {
    position: absolute; inset: 0; background: var(--board);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: fadeIn 0.15s ease;
  }
  .thanks-overlay svg { width: 90px; height: 90px; filter: url(#chalkTexture); }
  .thanks-overlay .msg { font-family: 'Kalam', cursive; font-size: 26px; margin-top: 14px; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* teacher trigger button */
  .finish-btn {
    position: absolute; bottom: 16px; right: 16px;
    background: rgba(242,237,225,0.06); border: 1.5px solid var(--line);
    color: var(--chalk-dim); font-weight: 700; font-size: 12.5px;
    padding: 10px 16px; border-radius: 10px;
    touch-action: manipulation;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .finish-btn.armed { border-color: var(--yellow); color: var(--chalk); background: rgba(232,185,74,0.18); }

  /* teacher modal */
  .modal-backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20;
  }
  .modal-card {
    background: var(--board-dark); border: 1px solid var(--line); border-radius: 16px;
    padding: 26px; width: 100%; max-width: 460px; max-height: 85vh; overflow-y: auto;
  }
  .bars { margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }
  .bar-row { display: flex; align-items: center; gap: 12px; }
  .bar-row svg { width: 26px; height: 26px; flex-shrink: 0; filter: url(#chalkTexture); }
  .bar-label {
    width: 96px; flex-shrink: 0; font-size: 12.5px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bar-track { flex: 1; background: rgba(242,237,225,0.07); border-radius: 8px; height: 24px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 8px; transition: width 0.4s ease; }
  .bar-count { width: 40px; text-align: right; font-weight: 800; font-size: 14px; }
  .total-line { margin-top: 14px; font-size: 13px; color: var(--chalk-dim); text-align: center; }
  .modal-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .btn-danger-outline {
    background: transparent; color: #e0745c; border: 1.5px solid #e0745c;
    font-weight: 700; font-size: 13px; padding: 10px 14px; border-radius: 8px; width: 100%;
  }
</style>
</head>
<body>

<div id="app-root">
  <svg width="0" height="0" style="position:absolute">
    <filter id="chalkTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="7"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/>
    </filter>
  </svg>
  <div id="content" style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center; flex:1;"></div>
</div>

<script>
(function () {
  const root = document.getElementById('content');
  const appRoot = document.getElementById('app-root');

  const SMILEY_OPTIONS = [
    { id: 1, label: "Not\nconfident", color: "#e0745c" },
    { id: 2, label: "A little\nunsure",  color: "#e8b94a" },
    { id: 3, label: "Pretty\nconfident", color: "#7fa89a" },
    { id: 4, label: "Very\nconfident",   color: "#8fd19e" },
  ];
  const CUSTOM_COLORS = ["#e0745c", "#e8b94a", "#7fa89a", "#8fd19e", "#9b8ec4", "#e39a54"];
  const MAX_CUSTOM_ANSWERS = 6;
  const MIN_CUSTOM_ANSWERS = 2;

  const ICONS = {
    1: `<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="#e0745c" stroke-width="2.5"/><circle cx="21" cy="25" r="2.2" fill="#e0745c"/><circle cx="39" cy="25" r="2.2" fill="#e0745c"/><path d="M20 42 Q30 33 40 42" fill="none" stroke="#e0745c" stroke-width="2.5" stroke-linecap="round"/></svg>`,
    2: `<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="#e8b94a" stroke-width="2.5"/><circle cx="21" cy="25" r="2.2" fill="#e8b94a"/><circle cx="39" cy="25" r="2.2" fill="#e8b94a"/><path d="M20 39 Q30 36 40 39" fill="none" stroke="#e8b94a" stroke-width="2.5" stroke-linecap="round"/></svg>`,
    3: `<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="#7fa89a" stroke-width="2.5"/><circle cx="21" cy="25" r="2.2" fill="#7fa89a"/><circle cx="39" cy="25" r="2.2" fill="#7fa89a"/><path d="M20 36 Q30 45 40 36" fill="none" stroke="#7fa89a" stroke-width="2.5" stroke-linecap="round"/></svg>`,
    4: `<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="#8fd19e" stroke-width="2.5"/><path d="M18 24 Q21 20 24 24" fill="none" stroke="#8fd19e" stroke-width="2.2" stroke-linecap="round"/><path d="M36 24 Q39 20 42 24" fill="none" stroke="#8fd19e" stroke-width="2.2" stroke-linecap="round"/><path d="M18 34 Q30 48 42 34" fill="none" stroke="#8fd19e" stroke-width="2.5" stroke-linecap="round"/></svg>`,
    check: `<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="#e8b94a" stroke-width="2.5"/><path d="M18 31 L26 39 L42 21" fill="none" stroke="#e8b94a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  };

  const STORAGE_KEY = 'kiosk-session';
  // session shape: { question, mode: 'smiley'|'custom', options: [{id,label,color}], counts: {id: n}, active }
  let session = null;
  let setupMode = 'smiley';
  let customAnswers = ['', ''];

  // This is a single-device kiosk (one iPad by the door), so plain localStorage
  // is all that's needed -- no account, no login, no network required.
  async function loadSession() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  async function saveSession() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(session)); } catch (e) {}
  }

  function render(html) { root.innerHTML = html; }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  function escapeAttr(s) { return escapeHtml(s || ''); }

  // ---------------- setup screen ----------------
  function showSetup(prefillQuestion) {
    setupMode = 'smiley';
    customAnswers = ['', ''];

    render(`
      <div class="setup-wrap">
        <div class="eyebrow">kiosk mode</div>
        <div class="chalk-title" style="font-size:26px; margin-bottom:18px;">Set today's question</div>
        <div class="card">
          <input type="text" id="q-input" placeholder="e.g. How confident do you feel about today's lesson?" value="${escapeAttr(prefillQuestion || '')}" />

          <div class="eyebrow" style="margin-top:22px;">Answer type</div>
          <div class="mode-toggle">
            <button class="mode-btn selected" id="mode-smiley" type="button">😊 Smiley faces</button>
            <button class="mode-btn" id="mode-custom" type="button">✏️ Add your own answers</button>
          </div>

          <div class="custom-builder" id="custom-builder" style="display:none;">
            <div class="eyebrow" style="margin-top:18px;">Answer choices</div>
            <div id="custom-rows"></div>
            <button class="btn-ghost" id="add-answer-btn" type="button">+ Add another answer</button>
          </div>

          <div id="q-error"></div>
          <button class="btn-primary" id="start-btn">Start kiosk</button>
        </div>
      </div>
    `);

    const builder = document.getElementById('custom-builder');
    const smileyBtn = document.getElementById('mode-smiley');
    const customBtn = document.getElementById('mode-custom');

    function renderCustomRows() {
      const rowsEl = document.getElementById('custom-rows');
      rowsEl.innerHTML = customAnswers.map((val, i) => `
        <div class="custom-row">
          <input type="text" class="custom-answer-input" data-idx="${i}" placeholder="Answer ${i + 1}" value="${escapeAttr(val)}" />
          <button class="remove-answer-btn" data-idx="${i}" type="button" ${customAnswers.length <= MIN_CUSTOM_ANSWERS ? 'disabled' : ''}>&times;</button>
        </div>
      `).join('');
      rowsEl.querySelectorAll('.custom-answer-input').forEach(inp => {
        inp.oninput = () => { customAnswers[parseInt(inp.dataset.idx, 10)] = inp.value; };
      });
      rowsEl.querySelectorAll('.remove-answer-btn').forEach(btn => {
        btn.onclick = () => {
          if (customAnswers.length <= MIN_CUSTOM_ANSWERS) return;
          customAnswers.splice(parseInt(btn.dataset.idx, 10), 1);
          renderCustomRows();
        };
      });
      document.getElementById('add-answer-btn').disabled = customAnswers.length >= MAX_CUSTOM_ANSWERS;
    }
    renderCustomRows();

    document.getElementById('add-answer-btn').onclick = () => {
      if (customAnswers.length >= MAX_CUSTOM_ANSWERS) return;
      customAnswers.push('');
      renderCustomRows();
    };

    smileyBtn.onclick = () => {
      setupMode = 'smiley';
      smileyBtn.classList.add('selected');
      customBtn.classList.remove('selected');
      builder.style.display = 'none';
    };
    customBtn.onclick = () => {
      setupMode = 'custom';
      customBtn.classList.add('selected');
      smileyBtn.classList.remove('selected');
      builder.style.display = 'block';
    };

    document.getElementById('start-btn').onclick = async () => {
      const val = document.getElementById('q-input').value.trim();
      if (!val) {
        document.getElementById('q-error').innerHTML = '<div class="error-msg">Type a question before starting.</div>';
        return;
      }

      let options, mode;
      if (setupMode === 'custom') {
        const filled = customAnswers.map(a => a.trim()).filter(a => a.length > 0);
        if (filled.length < MIN_CUSTOM_ANSWERS) {
          document.getElementById('q-error').innerHTML = '<div class="error-msg">Add at least two answer choices.</div>';
          return;
        }
        mode = 'custom';
        options = filled.map((text, i) => ({ id: i, label: text, color: CUSTOM_COLORS[i % CUSTOM_COLORS.length] }));
      } else {
        mode = 'smiley';
        options = SMILEY_OPTIONS;
      }

      const counts = {};
      options.forEach(o => { counts[o.id] = 0; });

      session = { question: val, mode, options, counts, active: true };
      await saveSession();
      showKiosk();
    };
  }

  // ---------------- kiosk screen ----------------
  function showKiosk() {
    const isSmiley = session.mode !== 'custom';
    const count = session.options.length;
    const countClass = count >= 5 ? 'count-5' : ('count-' + count);

    render(`
      <div class="kiosk-wrap">
        <div class="eyebrow">as you head out, tap one</div>
        <div class="kiosk-question">${escapeHtml(session.question)}</div>
        <div class="answer-grid ${countClass}">
          ${session.options.map(o => isSmiley ? `
            <button class="smiley-btn" data-val="${o.id}">
              ${ICONS[o.id]}
              <div class="cap">${o.label.replace('\n', '<br/>')}</div>
            </button>
          ` : `
            <button class="custom-btn" data-val="${o.id}" style="--opt-color:${o.color};">
              <div class="cap">${escapeHtml(o.label)}</div>
            </button>
          `).join('')}
        </div>
      </div>
      <button class="finish-btn" id="teacher-dot">Finish (double-tap)</button>
    `);

    root.querySelectorAll('.smiley-btn, .custom-btn').forEach(btn => {
      btn.onclick = async () => {
        root.querySelectorAll('.smiley-btn, .custom-btn').forEach(b => b.disabled = true);
        const val = btn.dataset.val;
        const key = isSmiley ? parseInt(val, 10) : val;
        session.counts[key] = (session.counts[key] || 0) + 1;
        await saveSession();
        showThanks();
      };
    });

    setupTeacherDot();
  }

  function showThanks() {
    const overlay = document.createElement('div');
    overlay.className = 'thanks-overlay';
    overlay.innerHTML = `${ICONS.check}<div class="msg">Thanks!</div>`;
    appRoot.appendChild(overlay);
    setTimeout(() => {
      overlay.remove();
      showKiosk();
    }, 1100);
  }

  function setupTeacherDot() {
    const btn = document.getElementById('teacher-dot');
    if (!btn) return;
    let lastTap = 0;
    let armedResetTimer = null;
    const DOUBLE_TAP_WINDOW = 400; // ms

    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const now = Date.now();
      if (now - lastTap < DOUBLE_TAP_WINDOW) {
        lastTap = 0;
        btn.classList.remove('armed');
        if (armedResetTimer) { clearTimeout(armedResetTimer); armedResetTimer = null; }
        showTeacherPanel();
      } else {
        lastTap = now;
        btn.classList.add('armed');
        if (armedResetTimer) clearTimeout(armedResetTimer);
        armedResetTimer = setTimeout(() => {
          btn.classList.remove('armed');
          lastTap = 0;
        }, DOUBLE_TAP_WINDOW);
      }
    });
  }

  // ---------------- teacher panel ----------------
  function showTeacherPanel() {
    const isSmiley = session.mode !== 'custom';
    const counts = session.counts;
    const total = session.options.reduce((sum, o) => sum + (counts[o.id] || 0), 0);
    const max = Math.max(1, ...session.options.map(o => counts[o.id] || 0));

    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal-card">
        <div class="eyebrow">Teacher view</div>
        <div class="chalk-title" style="font-size:20px;">${escapeHtml(session.question)}</div>
        <div class="bars">
          ${session.options.map(o => {
            const c = counts[o.id] || 0;
            const widthPct = Math.round((c / max) * 100);
            const marker = isSmiley
              ? ICONS[o.id]
              : `<div class="bar-label" style="color:${o.color};">${escapeHtml(o.label)}</div>`;
            return `
              <div class="bar-row">
                ${marker}
                <div class="bar-track"><div class="bar-fill" style="width:${widthPct}%; background:${o.color};"></div></div>
                <div class="bar-count">${c}</div>
              </div>
            `;
          }).join('')}
        </div>
        <div class="total-line">${total === 0 ? 'No responses yet.' : total + ' response' + (total === 1 ? '' : 's') + ' so far'}</div>
        <div class="modal-actions">
          <button class="btn-primary" id="close-panel">Back to kiosk</button>
          <button class="btn-ghost" id="new-question">Ask a new question</button>
          <button class="btn-danger-outline" id="reset-counts">Reset counts (keep question)</button>
        </div>
      </div>
    `;
    appRoot.appendChild(backdrop);

    backdrop.querySelector('#close-panel').onclick = () => backdrop.remove();
    backdrop.querySelector('#new-question').onclick = () => {
      backdrop.remove();
      showSetup('');
    };
    backdrop.querySelector('#reset-counts').onclick = async () => {
      const counts = {};
      session.options.forEach(o => { counts[o.id] = 0; });
      session.counts = counts;
      await saveSession();
      backdrop.remove();
      showTeacherPanel();
    };
  }

  // ---------------- boot ----------------
  (async function init() {
    session = await loadSession();
    if (session && session.active && session.question) {
      showKiosk();
    } else {
      showSetup();
    }
  })();
})();
</script>
</body>
</html>
